<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白板</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #board {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
      }
      #toolbar {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(30, 30, 30, 0.88);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }
      .tool,
      .color {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tool.active {
        outline: 2px solid #3b82f6;
        outline-offset: 1px;
      }
      .color {
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      .color.active {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .action {
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        color: #fff;
        font-size: 13px;
      }
      #clear {
        background: rgba(239, 68, 68, 0.75);
      }
      #save {
        background: #22c55e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="toolbar">
      <button type="button" class="tool" id="tool-pen" title="钢笔">✏️</button>
      <button type="button" class="tool" id="tool-line" title="直线">┃</button>
      <button type="button" class="tool" id="tool-arrow" title="箭头">→</button>
      <button type="button" class="tool" id="tool-rect" title="矩形">▭</button>
      <button type="button" class="tool" id="tool-ellipse" title="椭圆">◯</button>
      <span style="width: 1px; height: 20px; background: rgba(255,255,255,0.25)"></span>
      <button type="button" class="color" id="color-0" title="黑"></button>
      <button type="button" class="color" id="color-1" title="红"></button>
      <button type="button" class="color" id="color-2" title="蓝"></button>
      <button type="button" class="color" id="color-3" title="绿"></button>
      <span style="width: 1px; height: 20px; background: rgba(255,255,255,0.25)"></span>
      <button type="button" class="action" id="clear">清空</button>
      <button type="button" class="action" id="save">保存</button>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
