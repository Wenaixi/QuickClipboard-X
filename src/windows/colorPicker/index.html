<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>取色器</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
      }
      #magnifier {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 140px;
        height: 140px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #info {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(30, 30, 30, 0.82);
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 14px;
        line-height: 1.6;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        right: 16px;
        top: 16px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(30, 30, 30, 0.7);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="magnifier"></canvas>
    <div id="info">
      <div id="hex-value">—</div>
      <div id="rgb-value"></div>
    </div>
    <div id="hint">点击复制颜色 · Esc 退出</div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
