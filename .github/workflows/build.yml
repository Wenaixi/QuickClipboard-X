name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 测试面:纯 Rust 单测 + egui_kittest(阶段 1 起)，前端 JS 测试已随 WebView 移除。
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 单测走 dev profile,缓存与 release 分离,避免互相挤占与传输。
      - name: Cache Rust (test)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          key: ci-test

      - name: Run Rust unit tests
        run: cargo test --workspace

  # 构建面:cargo build --release 单 exe,无前端构建与安装器。
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    # 只用环境变量把 release profile 从 fat LTO 调成 thin LTO + 并行 codegen,
    # 大幅缩短 CI 编译时间;发布路径 release.yml 仍走 Cargo.toml 的 fat LTO
    # 最优产物,二者互不影响。
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (release)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          key: ci-release

      - name: Build executable
        run: cargo build --release

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          $versionLine = (Get-Content Cargo.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1)
          $version = ($versionLine -split '=')[1].Trim().Trim('"')
          $srcExe = 'target/release/quickclipboard.exe'
          $portable = "QuickClipboard_${version}_portable.exe"
          Copy-Item $srcExe $portable
          echo "Portable: $portable"

      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: QuickClipboard-portable
          path: QuickClipboard_*_portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: CI Summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## Build Summary'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Branch: ${{ github.ref_name }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Commit: ${{ github.sha }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Artifacts'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| Artifact | Path |'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '|----------|------|'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '| QuickClipboard-portable | QuickClipboard_<version>_portable.exe |'