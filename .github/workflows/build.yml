name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - mine

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 验证截图前端
        run: npm run test:screenshot

      - name: 构建前端资源
        run: npm run build

      - name: 验证 Rust 单元测试
        run: npm run test:rust
