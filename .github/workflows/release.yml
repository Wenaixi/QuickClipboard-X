name: Release

run-name: Release ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: Release (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name != 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Run screenshot tests
        run: npm run test:screenshot

      - name: Run emoji-kb tests
        run: npm run test:emoji-kb

      - name: Run mouse-guard tests
        run: npm run test:mouse-guard

      - name: Run Rust unit tests
        run: npm run test:rust

      - name: Build Tauri executable
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QuickClipboard ${{ github.ref_name }}'
          releaseBody: ""
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          updaterJsonKeepUniversal: true

      - name: Prepare portable versions
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $srcExe = 'src-tauri/target/release/QuickClipboard.exe'
          $portableExe = "QuickClipboard_${version}_portable.exe"
          $plainExe = "QuickClipboard_${version}.exe"
          Copy-Item $srcExe $portableExe
          Copy-Item $srcExe $plainExe
          echo "Created: $portableExe"
          echo "Created: $plainExe"
          Get-ChildItem -Path . -Filter '*.exe' -Recurse | Select-Object FullName, Length

      - name: Upload portable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            QuickClipboard_${{ github.ref_name }}_portable.exe
            QuickClipboard_${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable artifact (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: QuickClipboard-portable
          path: QuickClipboard_*_portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer artifact (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: QuickClipboard-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
